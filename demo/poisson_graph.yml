!rox:romjax.graph.FunctionGraph
nodes: [hf_coord, lf_coord, lf_res, hf_res]
edges:
  - !rox:romjax.poisson.Poisson2D
    source: hf_coord
    target: hf_res
    name: poisson
    config:
      grid:
        shape: &shape [32, 32]
        bounds: &bounds [[0, 1], [0, 1]]
      solver:
        name: Newton
        opts:
          rtol: 1
          atol: 1.0e-4
        max_steps: 200
        throw: true
    forcing: constant
    forcing_defaults: { const: -1.0 }
    conductivity: nonlinear
    conductivity_defaults: { k0: 1.0, alpha: 1.0 }
    conductivity_opts: { amplitude: exp }
    conductivity_sampler: parametric
    conductivity_sampler_opts:
      k0: 
        distribution: !!python/name:romjax.random_field.kle
        bounds: *bounds
        shape: *shape
        truncation: [8, 8]
        correlation_lengths: [0.2, 0.2]
        variance: 1
    outputs_sampler: near_solution
    outputs_sampler_opts:
      scale: [max_abs, 0.15]  # 10% relative
      phi:
        distribution: !!python/name:romjax.random_field.kle
        bounds: *bounds
        shape: *shape
        truncation: [8, 8]
        correlation_lengths: [0.2, 0.2]
        variance: 1
        weight: smooth
        weight_opts: { length_rel: 0.25 }
  - !rox:romjax.model.FilterModel
    source: hf_coord
    target: lf_coord
    name: coordinate transform
    filters:
      # POD on outputs only
      - forward: 
          callable: !!python/name:romjax.model.eqx_evaluate
          input_routes: [ [outputs] ]
          output_routes: [ [outputs] ]
          opts: { gather: flat, method: reduce }
        backward:
          callable: !!python/name:romjax.model.eqx_evaluate
          input_routes: [ [outputs] ]
          opts: { gather: flat, scatter: flat, method: reconstruct }
      # Pass inputs through
      - forward:  { input_routes: [ [inputs] ] }
        backward: { input_routes: [ [inputs] ] }
  - !rox:romjax.model.FilterModel
    source: hf_res
    target: lf_res
    name: residual transform
    filters:
      - forward:
          callable: !!python/name:romjax.model.eqx_evaluate
          input_routes: [ [residuals] ]
          output_routes: [ [residuals] ]
          opts: { gather: flat, method: reduce }
        backward:
          callable: !!python/name:romjax.model.eqx_evaluate
          input_routes: [ [residuals] ]
          opts: { gather: flat, scatter: flat, method: reconstruct }
      - forward:  { input_routes: [ [inputs] ] }
        backward: { input_routes: [ [inputs] ] }
  - !rox:romjax.graph.CompositeEdge
    source: lf_coord
    target: lf_res
    name: galerkin rom
    path: [coordinate transform, poisson, residual transform]
