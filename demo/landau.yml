!romx:Vlasov1D1V
grid:
  shape: [32, 32]
  bounds: [[0.0, 2.0], [-1.0, 1.0]]
solver:
  solver: {name: Tsit5}
  # stepsize_controller: {name: ConstantStepSize}
  stepsize_controller: 
    name: PIDController
    kwargs: 
      rtol: 1.0e-3
      atol: 1.0e-6
      pcoeff: 0.3
      icoeff: 0.3
      dcoeff: 0.0
  adjoint: {name: RecursiveCheckpointAdjoint}
  t0: 0.0
  t1: 5.0
  # dt0: 0.025
  num_save: 128
  max_steps: 2000
  throw: true
  progress_meter: { name: romjax.AliveProgressMeter }
fv:
  flux: upwind
  reconstruction: muscl
  limiter: van_leer
  cfl: 0.8
  enforce_cfl: true
params:
  knudsen: 1        # LU(-3, 3)
  debye: 0.5        # U(0.2, 1)
initial:
  callable: cosine
  inputs_default:
    alpha: 0.25     # U(0.05, 0.25)
    k: 3.141592654  # const
    n0: 1.0         # const
    u0: 0.0         # const
    T0: 0.1        # U(0.01, 0.1)
boundary:
  callable: identity
  inputs_default:
    vdf:
      boundary:
        - [{type: periodic, value: 0.0}, {type: periodic, value: 0.0}]
        - [{type: neumann, value: 0.0}, {type: neumann, value: 0.0}]
    potential:
      boundary:
        - [{type: dirichlet, value: 0.0}, {type: dirichlet, value: 0.0}]
