!romx:OptunaStudy
root: demo/optuna_study/output/serial
base: __parent__/base.yml
study_name: regression-serial
jax_platforms: cpu
n_trials: 40
write_policy: reuse
sampler:
  name: optuna.samplers.TPESampler
  kwargs: {seed: 42, n_startup_trials: 8, constant_liar: true}
pruner:
  name: optuna.pruners.SuccessiveHalvingPruner
  kwargs: {min_resource: 20, reduction_factor: 3, min_early_stopping_rate: 0, bootstrap_count: 0}
metric: {name: test_score, reduction: last}
override:
  - name: learning_rate
    path: [optimizer, kwargs, learning_rate]
    distribution: {kind: float, low: 1.0e-5, high: 0.1, log: true}
  - name: penalty
    path: [loss, penalty]
    distribution: {kind: categorical, choices: [l1, l2]}
  - name: weight
    path: [loss, weight]
    distribution: {kind: float, low: 1.0e-5, high: 0.1, log: true}
executor: {kind: serial, show_progress: true}
