graph_path: demo/poisson_graph.yml
dataset_policy: overwrite
overwrite_training: true
paths:
  root: demo/artifacts/poisson_linear
  dataset_dir: dataset
  training_dir: training
train:
  input_samples: 50
  outputs_per_input: 4
  input_seed: 0
  output_seed: 100
validation:
  input_samples: 5
  outputs_per_input: 2
  input_seed: 1
  output_seed: 200
optimizer:
  name: adam
  learning_rate: 1.0e-2
training:
  coordinate_latent_dim: 20
  residual_latent_dim: 20
  batch_size: 4
  steps: 500
  log_interval: 50
  validation_interval: 20
  init_seed: 0
  shuffle_seed: 1
  live_plot: false
loss:
  coordinate_weight: 1.0
  residual_weight: 1.0
  graph_weight: 1.0
