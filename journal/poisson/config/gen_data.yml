!romx:DataGeneration
routine_config: config/common.yml
root: dataset
write_policy: reuse
graph: config/graph.yml

datasets:
  train:
    poisson:
      input_samples: 250
      outputs_per_input: 10
      input_seed: 0
      output_seed: 1
    compression:
      loader: !romx:DataLoader
        root: dataset
        datasets:
          train:
            poisson: { kind: implicit, max_samples: 1000 }
      gather_paths: [poisson, outputs]
      compression: { energy_tol: 0.999 }
      filename: galerkin_compression.npz
    galerkin:
      samples: 200
      seed: 2
  validation:
    poisson:
      input_samples: 25
      outputs_per_input: 10
      input_seed: 3
      output_seed: 4
