solver: !romx:Poisson2D
  grid:
    shape: &s [8, 8]
    bounds: &b [[0, 1], [0, 1]]
  solver:
    solver:
      name: optimistix.Newton
      kwargs:
        rtol: 1.0e-2
        atol: 1.0e-6
  forcing: !pd:romjax.pde.GaussianForcing
    inputs_default:
      mu_x: 0.5
      mu_y: 0.5
      sigma: 0.1
      A0: 0.5
  conductivity: !pd:romjax.poisson.NonlinearConductivity
    inputs_default:
      alpha: 0.0
      k0: 1.0
  inputs_sampler: !romx:PyTreeSampler
    forcing:
      mu_x: { callable: uniform, minval: 0.4, maxval: 0.6 }
      A0: { callable: normal, mean: 0.5, std: 0.1 }
    conductivity:
      k0:
        callable: darcy
        shape: *s
        bounds: *b
