solver: !model:romtools.solvers.Poisson2D
  config:
    grid:
      shape: [50, 50]
      bounds: [[0, 1], [0, 1]]
    solver:
      name: Newton
      opts:
        rtol: 1.0e-2
        atol: 1.0e-6
  forcing: gaussian
  conductivity: nonlinear
  forcing_defaults:
    mu_x: 0.5
    mu_y: 0.5
    sigma: 0.1
    A0: 0.5
  conductivity_defaults:
    alpha: 0.0
    k0: 1.0
